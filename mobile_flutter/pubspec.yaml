name: gym_bruhh
description: "GYMBruhh - AI Gym & Fitness Companion built with Flutter & Dart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # Networking & Storage
  http: ^1.2.1
  shared_preferences: ^2.2.3

  # Charts & Visuals
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  confetti: ^0.7.0

  # Icons & Media
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
